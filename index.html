<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14a34e" />
    <meta name="description" content="乗換案内・地図ルート検索・スポット検索ができるナビアプリ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NAVIROOT" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>NAVIROOT 乗換・経路案内</title>
    <script>
      // 保存済みのテーマを最初の描画前に反映する（切り替え時のちらつき防止）
      (function () {
        var dark = false;
        try {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var mode = 'system';
        try {
          var raw = localStorage.getItem('naviroot:theme');
          if (raw) mode = JSON.parse(raw);
        } catch (e) {}
        document.documentElement.dataset.theme = mode === 'light' || mode === 'dark' ? mode : dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
