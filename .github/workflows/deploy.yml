name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - claude/keen-dirac-dgbkdt
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (served under /<repo-name>/ on GitHub Pages)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # リポジトリの Settings → Secrets and variables → Actions に登録すると、キーがアプリに組み込まれ
          # 端末側で入力しなくてよくなる（未登録なら空のまま = 従来どおり端末に保存したキーを使う）
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_NAVITIME_API_KEY: ${{ secrets.VITE_NAVITIME_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: How to fix (shown only when deployment fails)
        if: failure()
        run: |
          echo "::error title=GitHub Pages が有効になっていません::リポジトリの Settings → Pages → Build and deployment → Source で「GitHub Actions」を選んでください。GitHub Free の個人アカウントでは、先に Settings → General → Danger Zone → Change visibility で Public にする必要があります。設定後、Actions のこのワークフローを「Re-run jobs」すると公開されます。"
